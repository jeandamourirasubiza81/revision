    <title>Document</title>
    <style>
         *{
           margin: 0px;
            padding: 0px;
           box-sizing: border-box;
            }
           body{
           font-family: Arial, Helvetica, sans-serif;
           color: #ffffff;
           background-color:rgb(7, 78, 78);
            }
          .navbar{
          display: flex;
          justify-content:space-between;
          align-items: center;
          padding: 20px 60px;
          }


         .logo{
          font-size: 30px;
          color:#F75702;
          font-weight: bold;
          }
          .nav-link{
           display: flex;
           list-style: none;
           gap:25px;
         }
         .nav-link a{
           text-decoration: none;
           color: #ffffff;
           font-size: 18px;
         }
         .nav-link a:hover{
           color:#F75702;
          transition: 0.3s;
        } 
        .contact {
            width: 90%;
            max-width: 1000px;
            margin: 45px auto;
        }

        h2 {
            font-size: 32px;
            text-align: center;
            margin-bottom: 35px;
        }

        h2 span {
            color: #F75702;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
           
        }

        .icon {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ff5b03;
            border-radius: 50%;
        }

        .icon i {
            color: #ffffff;
            font-size: 19px;
        }
        .icon:hover{
            background: #F75702;
             color: white;
             transform: translateY(-3px);
        }


        .contact-card h3 {
            margin-bottom: 7px;
            color: #F75702;
        }

        .contact-card p {
            color: #ffffff;
            font-size: 14px;
            line-height: 1.6;
        }


        .contact-form {
            background: #0c4444;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #0f5880;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .contact-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            background:#102f40;
            color: white;
            border: 1px solid #ffffff;
            outline: none;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 20px;
            font: inherit;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #F75702;
        }

        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: #ffffff;
        }

        .contact-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        .send {
            display: block;
            margin: 0 auto;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            background: #F75702;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .send:hover {
            background: white;
            color: #F75702;
            transform: translateY(-2px);
        }

        .send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #formStatus {
            text-align: center;
            margin-top: 18px;
            line-height: 1.6;
        }

        
       .footer {
            padding: 25px 8%;
            text-align: center;
            background: #0c4444;
        }

        .footer p {
            color: #fff;
            font-size: 13px;
        }

        .footer span {
            color:#F75702;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 15px;
        }

        .social-links a {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid #F95703;
            border-radius: 50%;
            color: var(--cyan);
            transition: 0.3s;
            text-decoration: none; background:#F75702;
        }

        .social-links a:hover {
            background: #F75702;
            color: white;
            transform: translateY(-3px);
        }
        
      
    </style>
</head>
<body>

        <section class="contact">

        <h2>Contact <span>Me</span></h2>

       

        <!-- CONTACT INFORMATION -->
        <div class="container">

            <div class="contact-card">
                <div class="icon">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div>
                    <h3>My Address</h3>
                    <p>Kigali, Rwanda</p>
                </div>
            </div>

            <div class="contact-card">
                <div class="icon">
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div>
                    <h3>Email</h3>
                    <p>jeandamourirasubiza81@gmail.com</p>
                </div>
            </div>

            <div class="contact-card">
                <div class="icon">
                    <i class="fa-solid fa-phone"></i>
                </div>
                <div>
                    <h3>Call Me</h3>
                    <p>
                        +250794444287<br>
                        +250791918918
                    </p>
                </div>
            </div>

        </div>

     
        <form class="contact-form" id="contactForm">

            <div class="form-row">
                <div>
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        maxlength="100"
                        required>
                </div>

                <div>
                    <label for="phone">Phone</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Your phone number"
                        maxlength="30"
                        required>
                </div>
            </div>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="your@email.com"
                maxlength="254"
                required>

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                placeholder="Write your message..."
                maxlength="5000"
                required></textarea>

            <button type="submit" class="send" id="sendButton">
                <i class="fa-solid fa-paper-plane"></i>
                Send Message
            </button>

            <p id="formStatus" role="status" aria-live="polite"></p>

        </form>

    </section>
