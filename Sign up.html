<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     *{
         margin: 0px;
         padding: 0px;
         box-sizing: border-box;
       }
      body{
        font-family: Arial, Helvetica, sans-serif;
         color: #ffffff;
         background-color:rgb(7, 78, 78);
       }
      .navbar{
         display: flex;
         justify-content:space-between;
         align-items: center;
         padding: 20px 60px;
       }


        .logo{
          font-size: 30px;
           color:#F75702;
           font-weight: bold;
        }
        .nav-link{
           display: flex;
           list-style: none;
           gap:25px;
        }
        .nav-link a{
           text-decoration: none;
           color: #ffffff;
           font-size: 18px;
        }
            .nav-link a:hover{
            color:#F75702;
            transition: 0.3s;
        } 
        .sign-up {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
            ;
            
        }

        .container.sign {
            width: 100%;
            max-width: 590px;
            padding: 40px;
            background: #0c4444;
            border-radius: 20px;
            border: 5px solid rgba(15, 176, 187, 0.25);
        }

        .container.sign h2 {
            text-align: center;
            color: hsl(0, 0%, 100%);
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;
            color:white;
            font-weight: bold;
            font-size: 15px;
            margin: 15px 0 30px;
        }

        .subtitle em {
            color: #fc5901;
            font-style: normal;
        }

        .input {
            margin-bottom: 20px;
        }

        .input label {
            display: block;
            color: hsl(0, 0%, 100%);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #1a4254;
            border-radius: 10px;
            outline: none;
            color: #071D2B;
            background-color: #fff;
            font-size: 15px;
        }

        .input input:focus {
            border-color: hsl(184, 99%, 50%);
        }

        
        .password-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-field input {
            padding-right: 52px;
        }

        /* Eye button */
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #071D2B;
            cursor: pointer;
            font-size: 21px;
        }

        .toggle-password:hover {
            background-color: hwb(195 87% 2%);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            background-color: #fd5400;
            cursor: pointer;
            font-size: 16px;
        }

        .submit-btn:hover {
            background-color: #e74f03;
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .login-text {
            margin-top: 25px;
            text-align: center;
            color: #b8c7cf;
            font-size: 15px;
        }

        .container.sign a {
            color: #fb5d08;
            text-decoration: none;
        }

        .container.sign a:hover {
            text-decoration: underline;
        }

        #signupMessage {
            display: none;
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

    </style>
</head>
<body>
      <nav class="navbar">
        <div class="logo">JD</div>
        <ul class="nav-link">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./About.html">Abouts</a></li>
            <li><a href="./Service.html">Service</a></li>
            <li><a href="./Portfolio.html">Portfolio</a></li>
            <li><a href="./contact.html">Contacts</a></li>
            <li><a href="./login.html">Login</a></li>
        </ul>
    </nav>

    <section class="sign-up">

        <div class="container sign">

            <h2>Create Account</h2>

            <p class="subtitle">
                Sign up to get started with
                <span class="logo">
                    <em>J</em>.<b>D</b>.<i>I</i>
                </span>
            </p>

            <form id="forms">

                <div class="input">
                    <label for="name">Full Name:</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input">
                    <label for="email">Email:</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input">
                    <label for="password">Password:</label>

                    <div class="password-field">

                        <input

                            type="password"
                            id="password"
                            placeholder="Create a password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password"
                            aria-label="Show password"
                            aria-pressed="false"
                            title="Show or hide password"
                        >👁</button>

                    </div>
                </div>

                <div class="input">
                    <label for="confirm-password">
                        Confirm Password:
                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Confirm your password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirm-password"
                            aria-label="Show confirm password"
                            aria-pressed="false"
                            title="Show or hide password"
                        >👁</button>

                    </div>
                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    id="signupBtn"
                >
                    Sign Up
                </button>

                <p id="signupMessage" role="status"></p>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="./login.html" >Login</a>
            </p>

        </div>

    </section>
</body>
</html>
